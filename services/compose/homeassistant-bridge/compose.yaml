services:
  homeassistant-bridge:
    build:
      context: ../../..
      dockerfile: services/compose/homeassistant-bridge/Dockerfile
    image: agentbox/homeassistant-bridge:local
    environment:
      # The policy this bridge enforces, read live from the read-only mount like
      # grants.json, so editing a tier needs no rebuild. Nothing is built into
      # the image, so with the variable unset no file is found, and every tool
      # fails closed to approval_required, which is safer than enforcing a
      # stale policy.
      AGENTBOX_RUNTIME_POLICY: "${AGENTBOX_RUNTIME_POLICY:-/policy/approval-policy.yaml}"
      HA_URL: "${HA_URL:-}"
      HA_TOKEN: "${HA_TOKEN:-}"
      HA_BRIDGE_TOKEN: "${HA_BRIDGE_TOKEN:-}"
      # Comma-separated entity ids the assistant may act on. Empty means it can
      # read the house and change nothing, which is the right default for a
      # service that acts on the physical world.
      HA_CONTROLLABLE_ENTITIES: "${HA_CONTROLLABLE_ENTITIES:-}"
      # Cameras are opt-in one at a time, separately from control. Empty means
      # it can never look at anything.
      HA_VIEWABLE_CAMERAS: "${HA_VIEWABLE_CAMERAS:-}"
      # Screens cleared for full detail. Everything else is treated as shared,
      # which is the safe direction to fail.
      HA_PRIVATE_SCREENS: "${HA_PRIVATE_SCREENS:-}"
      # The local vision model. Frames are described here and discarded; no
      # image reaches the assistant or leaves this machine.
      VISION_BASE_URL: "${VISION_BASE_URL:-http://host.docker.internal:1240/v1}"
      VISION_MODEL: "${VISION_MODEL:-local-qwen25-vl-3b}"
      BRIDGE_LOG_FILE: "/logs/homeassistant-bridge.jsonl"
    # No host port. This bridge is reachable only on its compose
    # network, which the MCP gateway joins, so a leaked bridge token is
    # unusable by any process on the host. The gateway concentrating five
    # tokens is only a prize if something outside it can spend them; this is
    # what makes them unspendable. Operator probes go through the gateway's
    # /ready, which reports each bridge by name.
    # The vision model listens on the host loopback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      homeassistant:
    volumes:
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
      - "${AGENTBOX_POLICY_DIR:-${HOME}/.local/state/agentbox/policy}:/policy:ro"
      - "${AGENTBOX_POLICY_STATE_DIR:-${HOME}/.local/state/agentbox/policy-state}:/policy-state"
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: homeassistant-bridge
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

networks:
  homeassistant:
    name: homeassistant_default

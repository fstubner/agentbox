services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    # --- LAN EXPOSURE, DELIBERATE ---------------------------------------
    #
    # Host networking, which is the one service here that is not confined to
    # localhost. It is required, not convenient: device discovery is mDNS and
    # SSDP, both of which are link-local multicast and do not cross a Docker
    # bridge. Without this, Home Assistant finds nothing on the network and the
    # whole point of running it is lost.
    #
    # The consequence, stated plainly: Home Assistant listens on 192.0.2.10
    # (and every other interface), so anyone on the LAN can reach its login
    # page. That is normal for Home Assistant — you will want it from a phone —
    # but it is a real change in posture for this platform, and the
    # `agentbox.exposure: lan` label below is what `validate` requires before
    # allowing host networking at all.
    #
    # It is NOT reachable from the internet unless you forward a port, which
    # `expose_services_to_internet` puts in always_denied.
    network_mode: host
    environment:
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - "${AGENTBOX_HA_CONFIG:-${HOME}/.local/state/agentbox/homeassistant}:/config"
      - /etc/localtime:/etc/localtime:ro
      # --- BLUETOOTH, DELIBERATE -------------------------------------------
      #
      # Home Assistant talks to Bluetooth through BlueZ, and BlueZ is reached
      # over the system D-Bus. Without this socket the integration can see the
      # adapter (host networking) but cannot drive it, which is not a quiet
      # failure: it logged "Failed to force stop scanner" every ten minutes for
      # two days while discovering nothing at all.
      #
      # State the cost plainly. This is the system bus, not a private one, so
      # the container can address other services on it — a wider grant than a
      # device mapping. It is here because there are real Bluetooth devices to
      # talk to; a deployment with none should delete these three lines and
      # disable the integration rather than carry the grant for nothing.
      #
      # Mounted read-only: connecting to a socket is not a filesystem write, so
      # this costs nothing and stops the container creating files in /run/dbus.
      - /run/dbus:/run/dbus:ro
    # The Zigbee radio, mapped by its stable by-id path rather than
    # /dev/ttyUSB0 — the numbered name is assigned in probe order and will
    # move the first time another serial device is plugged in, silently
    # pointing Home Assistant at the wrong hardware.
    devices:
      - "${AGENTBOX_ZIGBEE_DEVICE:-/dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_da0a97b12e53ef1196672de0174bec31-if00-port0}:/dev/ttyZIGBEE"
    cpus: "2.00"
    mem_limit: 2048m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
      # docker-default plus D-Bus rules for BlueZ, and nothing else. See
      # services/apparmor/agentbox-homeassistant for why this exists rather
      # than `apparmor=unconfined`: every restriction docker-default imposes
      # still applies, and the container can reach org.bluez but not systemd,
      # logind, NetworkManager or anything else on the system bus.
      #
      # Install it before deploying, or the container will not start:
      #   sudo cp services/apparmor/agentbox-homeassistant /etc/apparmor.d/
      #   sudo apparmor_parser -r -W /etc/apparmor.d/agentbox-homeassistant
      - apparmor=agentbox-homeassistant
    # BLE scanning needs raw socket access to the adapter. NET_ADMIN alone is
    # not enough and NET_RAW alone is not enough; BlueZ wants both to start a
    # scan. Still no --privileged, and no-new-privileges above still holds.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8123/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    labels:
      agentbox.service: homeassistant
      # Read by `validate`: host networking is refused without it.
      agentbox.exposure: lan
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    # --- LAN EXPOSURE, DELIBERATE ---------------------------------------
    #
    # Host networking. This is the one service here that is not confined to
    # localhost. It is required. Device discovery uses mDNS and SSDP, which are
    # link-local multicast and do not cross a Docker bridge. Without host
    # networking, Home Assistant finds no devices on the network.
    #
    # As a result, Home Assistant listens on 192.0.2.10 (and every other
    # interface), so anyone on the LAN can reach its login page. That is normal
    # for Home Assistant, and you will want it from a phone. It is still a
    # change in exposure for this platform. `validate` requires the
    # `agentbox.exposure: lan` label below before it allows host networking.
    #
    # It is NOT reachable from the internet unless you forward a port, which
    # `expose_services_to_internet` puts in always_denied.
    network_mode: host
    environment:
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - "${AGENTBOX_HA_CONFIG:-${HOME}/.local/state/agentbox/homeassistant}:/config"
      - /etc/localtime:/etc/localtime:ro
      # --- BLUETOOTH, DELIBERATE -------------------------------------------
      #
      # Home Assistant talks to Bluetooth through BlueZ, and BlueZ is reached
      # over the system D-Bus. Without this socket the integration can see the
      # adapter (host networking) but cannot drive it. It then logs "Failed to
      # force stop scanner" every ten minutes and discovers nothing.
      #
      # This is the system bus, not a private one, so the container can
      # address other services on it. That is a wider grant than a device
      # mapping. It is here because there are Bluetooth devices to talk to. A
      # deployment with none should delete these three lines and disable the
      # integration instead of keeping an unused grant.
      #
      # Mounted read-only. Connecting to a socket is not a filesystem write, so
      # read-only does not break anything, and it stops the container creating
      # files in /run/dbus.
      - /run/dbus:/run/dbus:ro
    # The Zigbee radio, mapped by its stable by-id path instead of
    # /dev/ttyUSB0. The numbered name is assigned in probe order and changes
    # when another serial device is plugged in. Home Assistant would then point
    # at the wrong hardware with no error.
    #
    # The default below is a placeholder and will not match your hardware. Set
    # AGENTBOX_ZIGBEE_DEVICE to your own path. `ls /dev/serial/by-id/` prints
    # it. The name encodes the adapter model and its serial number. That makes
    # it stable, and it is also why it cannot be shipped as a default.
    #
    # If you have no Zigbee radio, delete these three lines. A device mapping
    # for hardware that is not present stops the container from starting.
    devices:
      - "${AGENTBOX_ZIGBEE_DEVICE:-/dev/serial/by-id/usb-REPLACE_WITH_YOUR_ADAPTER-if00-port0}:/dev/ttyZIGBEE"
    cpus: "2.00"
    mem_limit: 2048m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
      # docker-default plus D-Bus rules for BlueZ, and nothing else. See
      # services/apparmor/agentbox-homeassistant for why this is used instead
      # of `apparmor=unconfined`. Every restriction docker-default imposes
      # still applies, and the container can reach org.bluez but not systemd,
      # logind, NetworkManager or anything else on the system bus.
      #
      # Install it before deploying, or the container will not start:
      #   sudo cp services/apparmor/agentbox-homeassistant /etc/apparmor.d/
      #   sudo apparmor_parser -r -W /etc/apparmor.d/agentbox-homeassistant
      - apparmor=agentbox-homeassistant
    # BLE scanning needs raw socket access to the adapter. BlueZ needs both
    # NET_ADMIN and NET_RAW to start a scan. The container is still not
    # --privileged, and no-new-privileges above still applies.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8123/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    labels:
      agentbox.service: homeassistant
      # Read by `validate`. Host networking is refused without it.
      agentbox.exposure: lan
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

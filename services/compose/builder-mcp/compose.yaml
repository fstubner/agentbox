services:
  builder-mcp:
    build:
      context: ../../..
      dockerfile: services/compose/builder-mcp/Dockerfile
    image: agentbox/builder-mcp:local
    environment:
      BUILDER_BRIDGE_URL: "${BUILDER_BRIDGE_URL:-http://builder-bridge:8080}"
      BUILDER_BRIDGE_TOKEN: "${BUILDER_BRIDGE_TOKEN:-}"
      BUILDER_MCP_SHARED_TOKEN: "${BUILDER_MCP_SHARED_TOKEN:-}"
      MCP_OUTCOME_FILE: "/logs/builder-mcp-outcomes.jsonl"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:3475:8080"
    networks:
      builder:
    volumes:
      - "${AGENTBOX_POLICY_DIR:-${HOME}/.local/state/agentbox/policy}:/policy:ro"
      - "${AGENTBOX_POLICY_STATE_DIR:-${HOME}/.local/state/agentbox/policy-state}:/policy-state"
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: builder-mcp
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

networks:
  builder:
    external: true
    name: builder_default

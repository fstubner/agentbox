services:
  vikunja-bridge:
    build:
      context: ../../..
      dockerfile: services/compose/vikunja-bridge/Dockerfile
    image: agentbox/vikunja-bridge:local
    environment:
      # The policy this bridge enforces, read live from the read-only mount like
      # grants.json, so editing a tier needs no rebuild. No policy is built into
      # the image. With the variable unset no file is found, and every tool
      # fails closed to approval_required. That is safer than enforcing a stale
      # policy.
      AGENTBOX_RUNTIME_POLICY: "${AGENTBOX_RUNTIME_POLICY:-/policy/approval-policy.yaml}"
      VIKUNJA_URL: "${VIKUNJA_URL:-http://vikunja:3456}"
      VIKUNJA_API_TOKEN: "${VIKUNJA_API_TOKEN:-}"
      VIKUNJA_BRIDGE_TOKEN: "${VIKUNJA_BRIDGE_TOKEN:-}"
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8080"
      BRIDGE_LOG_FILE: "/logs/vikunja-bridge.jsonl"
    # No host port. This bridge is reachable only on its compose network,
    # which the MCP gateway joins, so no process on the host can use a leaked
    # bridge token. The gateway holds five tokens, and this is what keeps
    # anything outside the gateway from using them. Operator probes go through
    # the gateway's /ready, which reports each bridge by name.
    networks:
      vikunja:
    volumes:
      # Request log that survives container recreate; `docker logs` does not.
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
      # Grants are read-only and spent markers are writable. The bridge is the
      # authoritative gate, so it needs both. Writing a marker can only remove
      # permission, never create it.
      - "${AGENTBOX_POLICY_DIR:-${HOME}/.local/state/agentbox/policy}:/policy:ro"
      - "${AGENTBOX_POLICY_STATE_DIR:-${HOME}/.local/state/agentbox/policy-state}:/policy-state"
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: vikunja-bridge
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

networks:
  vikunja:
    external: true
    name: vikunja_default

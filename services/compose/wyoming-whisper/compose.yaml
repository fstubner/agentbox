# Speech to text for the house, on this box.
#
# The Discord voice path already transcribes locally, with faster-whisper
# inside the gateway process. This is the same model served over the Wyoming
# protocol so that Home Assistant can reach it. A satellite in another room
# needs that. The Pi streams audio to Home Assistant, and Home Assistant asks
# this service for the words.
#
# Why a service and not an add-on: Home Assistant here is a plain container,
# not Home Assistant OS, so there is no add-on store. For that reason the
# Assist pipeline on this box has `stt_engine: None`, and a satellite without
# a speech-to-text engine wakes, streams audio and gets no response.
#
# Why this exists.
#
# docs/voice.md accepts lower speech quality to keep speech local: "nothing
# spoken to the assistant and nothing it says back leaves the machine". Every
# speaker already in this house is an Echo, a Chromecast or a Sony TV. Routing
# household speech through any of them would accept Piper's lower quality and
# still send speech off the box. A local satellite plus this service keeps
# speech local when voice is used outside Discord.

services:
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper
    command:
      # `base` because the gateway already uses it and it is verified on this
      # hardware. See docs/voice.md, where a text -> Piper -> WAV ->
      # faster-whisper round trip came back identical. Larger models improve
      # quality but use more memory, on a box where a benchmark and the
      # production model already cannot run at the same time.
      - --model
      - base
      - --language
      - en
      - --beam-size
      - "1"
    # Loopback only. Home Assistant runs with host networking, so 127.0.0.1
    # from its perspective is this host. It reaches this without the port
    # being on the LAN. Nothing else needs to reach it.
    ports:
      - "127.0.0.1:10300:10300"
    volumes:
      - whisper_models:/data
    cpus: "2.00"
    # Whisper base plus the runtime, with a tight limit. This deployment has
    # 16 GB shared with a model server, and an unbounded transcriber could push
    # the box into heavy swapping while someone is speaking.
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',10300),3)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    labels:
      agentbox.service: wyoming-whisper
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

volumes:
  whisper_models:

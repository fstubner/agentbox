services:
  memory-bridge:
    build:
      context: ../../..
      dockerfile: services/compose/memory-bridge/Dockerfile
    image: agentbox/memory-bridge:local
    environment:
      # The policy this bridge enforces, read from the read-only mount rather
      # than the copy baked into the image. Editing a tier used to mean
      # rebuilding every bridge; grants.json has always been read live from
      # this same mount, and a grant is the sharper decision of the two.
      # Unset falls back to /app/approval-policy.yaml, and a missing file
      # fails closed — every tool drops to approval_required.
      AGENTBOX_RUNTIME_POLICY: "${AGENTBOX_RUNTIME_POLICY:-/policy/approval-policy.yaml}"
      MEMORY_BRIDGE_TOKEN: "${MEMORY_BRIDGE_TOKEN:-}"
      # Operator credential for approving proposals. Unset = approval
      # disabled (fails closed); the assistant never receives this.
      MEMORY_REVIEW_TOKEN: "${MEMORY_REVIEW_TOKEN:-}"
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8080"
      BRIDGE_LOG_FILE: "/logs/memory-bridge.jsonl"
      MEMORY_PATH: "/data/memory.json"
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:3471:8080"
    volumes:
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
      # Grants read-only; spent markers writable. The bridge is the
      # authoritative gate, so it needs both — but writing a marker can
      # only remove permission, never create it.
      - "${AGENTBOX_POLICY_DIR:-${HOME}/.local/state/agentbox/policy}:/policy:ro"
      - "${AGENTBOX_POLICY_STATE_DIR:-${HOME}/.local/state/agentbox/policy-state}:/policy-state"
      - memory_data:/data
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: memory-bridge
      # `operator`: published on the host loopback on purpose — the memory
      # review CLI (`agentbox memory approve|reject`) talks to this bridge
      # directly with the review token, a credential no container holds.
      agentbox.exposure: operator
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

volumes:
  memory_data:

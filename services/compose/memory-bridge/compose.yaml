services:
  memory-bridge:
    build:
      context: ../../..
      dockerfile: services/compose/memory-bridge/Dockerfile
    image: agentbox/memory-bridge:local
    environment:
      MEMORY_BRIDGE_TOKEN: "${MEMORY_BRIDGE_TOKEN:-}"
      # Operator credential for approving proposals. Unset = approval
      # disabled (fails closed); the assistant never receives this.
      MEMORY_REVIEW_TOKEN: "${MEMORY_REVIEW_TOKEN:-}"
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8080"
      BRIDGE_LOG_FILE: "/logs/memory-bridge.jsonl"
      MEMORY_PATH: "/data/memory.json"
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:3471:8080"
    volumes:
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
      - memory_data:/data
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: memory-bridge
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

volumes:
  memory_data:

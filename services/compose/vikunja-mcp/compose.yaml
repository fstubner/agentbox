services:
  vikunja-mcp:
    build:
      context: ../../..
      dockerfile: services/compose/vikunja-mcp/Dockerfile
    image: agentbox/vikunja-mcp:local
    environment:
      VIKUNJA_BRIDGE_URL: "${VIKUNJA_BRIDGE_URL:-http://vikunja-bridge:8080}"
      VIKUNJA_BRIDGE_TOKEN: "${VIKUNJA_BRIDGE_TOKEN:-}"
      VIKUNJA_MCP_SHARED_TOKEN: "${VIKUNJA_MCP_SHARED_TOKEN:-}"
      MCP_OUTCOME_FILE: "/logs/vikunja-mcp-outcomes.jsonl"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:3467:8080"
    networks:
      vikunja:
    volumes:
      # Grants written by `agentbox grant`. Read-only: the assistant side
      # must never be able to issue itself permission.
      - "${AGENTBOX_POLICY_DIR:-${HOME}/.local/state/agentbox/policy}:/policy:ro"
      # Consumption records. Writable, but writing here can only spend a
      # grant, never create one — so it confers no authority.
      - "${AGENTBOX_POLICY_STATE_DIR:-${HOME}/.local/state/agentbox/policy-state}:/policy-state"
      # Outcome journal: what the assistant tried and what happened.
      # Recording an outcome grants nothing, so this carries no authority
      # either — same argument as the consumption records above.
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: vikunja-mcp
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

networks:
  vikunja:
    external: true
    name: vikunja_default

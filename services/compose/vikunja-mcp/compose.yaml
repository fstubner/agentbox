services:
  vikunja-mcp:
    build:
      context: .
    image: agent-control-plane/vikunja-mcp:local
    environment:
      VIKUNJA_BRIDGE_URL: "${VIKUNJA_BRIDGE_URL:-http://vikunja-bridge:8080}"
      VIKUNJA_BRIDGE_TOKEN: "${VIKUNJA_BRIDGE_TOKEN:-}"
      VIKUNJA_MCP_SHARED_TOKEN: "${VIKUNJA_MCP_SHARED_TOKEN:-}"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:3467:8080"
    networks:
      vikunja:
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agent-control-plane.service: vikunja-mcp
      agent-control-plane.exposure: private

networks:
  vikunja:
    external: true
    name: agent-control-plane-vikunja_default

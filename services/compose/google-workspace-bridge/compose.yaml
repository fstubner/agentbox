services:
  google-workspace-bridge:
    build:
      context: ../../..
      dockerfile: services/compose/google-workspace-bridge/Dockerfile
    image: agentbox/google-workspace-bridge:local
    environment:
      # The policy this bridge enforces, read from the read-only mount rather
      # than the copy baked into the image. Editing a tier used to mean
      # rebuilding every bridge; grants.json has always been read live from
      # this same mount, and a grant is the sharper decision of the two.
      # Nothing is baked into the image any more, so an unset variable
      # finds no file and fails closed — every tool drops to
      # approval_required. That is the intended answer to a missing mount:
      # enforcing a stale policy silently is the worse of the two.
      AGENTBOX_RUNTIME_POLICY: "${AGENTBOX_RUNTIME_POLICY:-/policy/approval-policy.yaml}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REFRESH_TOKEN: "${GOOGLE_REFRESH_TOKEN:-}"
      GOOGLE_BRIDGE_TOKEN: "${GOOGLE_BRIDGE_TOKEN:-}"
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8080"
      BRIDGE_LOG_FILE: "/logs/google-workspace-bridge.jsonl"
    # No host port, deliberately. This bridge is reachable only on its compose
    # network, which the MCP gateway joins — so a leaked bridge token is
    # unusable by any process on the host. The gateway concentrating five
    # tokens is only a prize if something outside it can spend them; this is
    # what makes them unspendable. Operator probes go through the gateway's
    # /ready, which reports each bridge by name.
    volumes:
      # Request log that survives container recreate; `docker logs` does not.
      - "${AGENTBOX_LOG_DIR:-${HOME}/.local/state/agentbox/logs}:/logs"
      # Grants read-only; spent markers writable. The bridge is the
      # authoritative gate, so it needs both — but writing a marker can
      # only remove permission, never create it.
      - "${AGENTBOX_POLICY_DIR:-${HOME}/.local/state/agentbox/policy}:/policy:ro"
      - "${AGENTBOX_POLICY_STATE_DIR:-${HOME}/.local/state/agentbox/policy-state}:/policy-state"
    cpus: "0.50"
    mem_limit: 160m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      agentbox.service: google-workspace-bridge
      agentbox.exposure: private
      agentbox.source_sha: "${AGENTBOX_SOURCE_SHA:-unknown}"

name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless, and on a private repo that
# run is still consuming the account's shared Actions minutes. Runs on the
# default branch are left alone: that is the history everything else is
# compared against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Full-history secret scan
        run: gitleaks detect --source . -v --redact --exit-code=2
      - name: PII grep gate
        # Narrowed 2026-10-03. The alternation used to include home
        # directories for agentbox, assistant and hermes, which are *service
        # account* paths the code legitimately names — cli/agentbox_backup.py
        # has to say where the gateway keeps its state. So this gate failed on
        # correct code, and had done since it was written. A check that cannot
        # pass is one people learn to skip.
        #
        # It also listed an example identity, which is wrong here: the example
        # household members are documented in PRODUCT.md and a fixture using
        # one of their home directories is correct, not a leak.
        #
        # What is left is the shape of real personal data rather than any
        # particular person: a consumer mailbox, and an RFC1918 address. The
        # docker bridge (172.17.0.0/16) is deliberately not listed, because
        # host.docker.internal genuinely resolves there and the code says so.
        run: |
          hits=$(git grep -nIE '@gmail\.com|@googlemail\.com|@hotmail\.com|@outlook\.com|192\.168\.[0-9]|\b10\.[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless, and on a private repo that
# run is still consuming the account's shared Actions minutes. Runs on the
# default branch are left alone: that is the history everything else is
# compared against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Full-history secret scan
        run: gitleaks detect --source . -v --redact --exit-code=2
      - name: PII grep gate
        run: |
          hits=$(git grep -nIE '@gmail\.com|/home/(alex|assistant|agentbox|hermes)' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

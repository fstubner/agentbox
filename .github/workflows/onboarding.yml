# Can somebody who has never seen this repository get it running?
#
# The test suite runs against a checkout that is already configured, so it
# cannot answer that. This follows README.md's quickstart literally, in order,
# on a machine that has never seen Agentbox. A step that only works because of
# something undocumented in my home directory fails here instead of failing for
# someone else.
#
# Each documented step is its own job step, so the log says which instruction
# broke rather than that the job broke.

name: clean-room onboarding

on:
  workflow_dispatch:
  push:
    paths:
      - README.md
      - cli/agentbox
      - cli/agentbox_setup.py
      - services/compose/**
      - .github/workflows/onboarding.yml
  schedule:
    # Weekly, because a prerequisite that stops being installed by default on
    # the runner image goes unnoticed until somebody tries.
    - cron: "17 6 * * 1"

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "README step 1: prerequisites, exactly as listed"
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          python3 --version
          git --version
          docker --version
          docker compose version

      - name: "README step 2: ./cli/agentbox setup"
        run: ./cli/agentbox setup

      - name: "Did setup produce what it promised?"
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$1" ]; then echo "ok    $1"; else echo "MISSING $1"; fail=1; fi
          }
          check "$HOME/.config/agentbox"
          check "$HOME/.local/state/agentbox/logs"
          check "$HOME/.local/state/agentbox/portal"
          check "$HOME/.local/state/agentbox/invites"
          check cli/agentbox-sandbox
          # Mode matters: the README claims 0700, and a world-readable config
          # directory on a shared host is a different product.
          mode=$(stat -c '%a' "$HOME/.config/agentbox")
          echo "mode of ~/.config/agentbox = $mode"
          [ "$mode" = "700" ] || { echo "expected 700"; fail=1; }
          exit $fail

      - name: "README step 4: ./cli/agentbox validate"
        run: ./cli/agentbox validate

      - name: "README step 4: ./cli/agentbox doctor on a bare machine"
        run: |
          set -uo pipefail
          # Expected to report problems, since nothing is deployed yet. It must
          # not crash. A first diagnostic should say what is wrong, not print a
          # traceback.
          ./cli/agentbox doctor > doctor.log 2>&1 || true
          tail -40 doctor.log
          if grep -q "Traceback (most recent call last)" doctor.log; then
            echo "::error::doctor crashed on a clean machine"
            exit 1
          fi
          echo "doctor completed without crashing"

      - name: "README step 5: deploy one service with no secrets configured"
        run: |
          set -uo pipefail
          # memory-bridge is the right probe: it builds from this repo rather
          # than pulling a third-party image, and its token is optional and
          # fails closed, so it should come up unconfigured.
          ./cli/agentbox deploy memory-bridge > deploy.log 2>&1
          code=$?
          tail -40 deploy.log
          exit $code

      - name: "Is it actually running, or did deploy just say so?"
        run: |
          set -euo pipefail
          docker ps --format '{{.Names}}\t{{.Status}}'
          docker ps --format '{{.Names}}' | grep -q memory-bridge
          echo "memory-bridge is up"

      - name: "Teardown"
        if: always()
        run: docker ps -aq | xargs -r docker rm -f

# Machine-readable mirror of approval-policy.md. Loaded by the gateway/CLI and
# by policy_gate.py in every MCP.
#
# Semantics: tiers are checked always_denied -> approval_required -> allowed;
# unknown actions default to approval_required (deny-by-default).
#
# One policy, two kinds of actor. `tiers` names capabilities — what may be done,
# in language a human can review. `tools` maps each assistant-visible MCP tool
# onto the capability it exercises, so a tool call resolves to the same tier as
# the equivalent operator action.
#
# This was briefly two files, and they immediately contradicted each other:
# personal_data_access_beyond_task and gmail_label_management were
# approval_required here while search_gmail and add_gmail_labels were allowed
# there. Same system, opposite answers. A capability belongs in exactly one
# place; the tool map is an index into it, not a second policy.
#
# Tiering principle: prefer narrowing a capability over gating it. A constraint
# holds even when the model is compromised; an approval only helps if a human
# reads carefully before saying yes. Several tools below are `allowed` because
# the bridge already contains them, not because the risk was waved through.
version: 2

tiers:
  allowed:        # no approval needed
    # Operator / development
    - read_repo_files
    - inspect_service_logs
    - run_validators_and_tests
    - draft_plans_issues_prs_skills
    - create_branches
    - generate_compose_proposals
    - scaffold_service_for_review    # writes a branch; never deploys or merges

    # Assistant
    - task_management                # the assistant's own workspace; reversible, nothing deletes
    - personal_data_read             # gmail/calendar reads — see the note below
    - propose_memory_for_review      # inert until an operator approves it
    - home_read_state                # sensor/entity state from Home Assistant
    - home_control_comfort           # lights, scenes, media — allowlisted entities only
    - home_view_camera               # one frame, on request, from an allowlisted camera
    - email_label_own_namespace      # agentbox/* labels only, enforced in the bridge
    - compose_email_draft            # drafts are never sent
    - create_agent_calendar_event    # agent calendar only; attendees refused

  approval_required:
    # Operator / development
    - service_lifecycle              # start/stop/restart/remove services
    - host_package_install
    - add_mcp_server
    - enable_skill_bundle_production
    - home_control_climate           # heating/cooling: costs money, affects a sleeping household
    - home_write_automation          # stored code that runs unattended, later
    - modify_production_gateway_config
    - change_network_bindings_or_ports
    - spend_money                    # incl. grocery orders, paid APIs over limit
    - health_sensitive_recommendations

    # Assistant
    - email_state_change             # archive / mark read — changes what the operator sees
    - store_sensitive_memory         # durable write; also gated by the memory review token
    - send_external_communications   # messages/emails/invites

  always_denied:  # only a human, outside the assistant, may do these
    - merge_own_pr
    - disable_approval_gates
    - expose_services_to_internet
    - read_raw_longlived_credentials
    - delete_emails_files_repos_backups_prod_data
    - modify_upstream_agent_source
    - medical_diagnosis_or_medication_guidance
    - home_control_security          # locks, alarms, garage doors, covers

# Assistant tool -> capability. A tool absent from this map resolves to no
# capability and therefore to approval_required, so a tool added without being
# mapped fails closed. `cli/agentbox validate` fails on an unmapped tool rather
# than letting it fail closed silently at runtime.
tools:
  # vikunja-mcp
  list_projects: task_management
  find_or_create_project: task_management
  list_tasks: task_management
  find_or_create_task: task_management
  create_task: task_management
  update_task: task_management
  complete_task: task_management
  add_task_comment: task_management

  # memory-mcp
  propose_memory: propose_memory_for_review
  list_memory_proposals: propose_memory_for_review
  search_memories: propose_memory_for_review
  # Reading its own outcome journal. inspect_service_logs was already `allowed`
  # and had no tool behind it; this is the tool. Reading counts about its own
  # behaviour grants nothing and is the precondition for reflecting on evidence
  # rather than on recollection.
  review_own_activity: inspect_service_logs

  # Home Assistant. Control is constrained rather than gated: the bridge
  # refuses any entity outside an operator-configured allowlist, and refuses
  # the security domains outright regardless of the allowlist. An approval on
  # "turn on a light" would be asked so often it would be granted unread.
  list_home_entities: home_read_state
  get_home_entity: home_read_state
  set_home_light: home_control_comfort
  activate_home_scene: home_control_comfort
  set_home_climate: home_control_climate
  list_home_automations: home_read_state
  # Static validation proves an automation cannot reach a lock or a template;
  # it cannot say whether the automation is a good idea. Code that runs
  # unattended at 3am deserves a human reading it once.
  create_home_automation: home_write_automation
  # Allowed, because the allowlist is the constraint and an approval on "look
  # at the kitchen" would be granted unread. Every camera is opt-in one at a
  # time, nothing is stored, and the frame never enters the assistant's
  # context — the bridge asks the local vision model and returns text.
  look_at_camera: home_view_camera
  cast_to_screen: home_control_comfort

  # Builder: the assistant reads the repo and proposes changes as git branches.
  # All `allowed` because none of them ships anything — a proposal is a branch a
  # human must merge, and merge_own_pr stays always_denied. The containment that
  # matters is not this tier list but the builder bridge's protected-path check,
  # which refuses edits to the policy, both gates, the operator CLI and CI. A
  # tier cannot express "may edit any file except the ones that govern it".
  list_repo_files: read_repo_files
  read_repo_file: read_repo_files
  list_proposals: read_repo_files
  run_repo_checks: run_validators_and_tests
  propose_change: create_branches

  # google-workspace-mcp-lite — reads
  search_gmail: personal_data_read
  read_gmail: personal_data_read
  clean_gmail: personal_data_read
  list_gmail_labels: personal_data_read
  list_calendars: personal_data_read
  list_calendar_events: personal_data_read
  calendar_freebusy: personal_data_read

  # google-workspace-mcp-lite — writes
  create_gmail_label: email_label_own_namespace
  add_gmail_labels: email_label_own_namespace
  create_gmail_draft: compose_email_draft
  create_agent_calendar_event: create_agent_calendar_event
  archive_gmail: email_state_change
  mark_gmail_read: email_state_change

# Decisions taken when the two policies were merged, recorded because they
# changed what the policy asserts:
#
# personal_data_access_beyond_task was approval_required and is now
# personal_data_read (allowed). The "beyond task" qualifier is the part that
# mattered, and a tier cannot express it — whether a read exceeds what the
# current task needs is a per-call judgement. Gating all reads instead would
# make an assistant whose job is the operator's mail and calendar unusable.
# The narrower risk, data leaving the account, is contained elsewhere: no tool
# sends mail, and calendar invites are refused at the bridge.
#
# email_mutations covered archive, mark-read and labelling together. Split,
# because the bridge now constrains labels to the agentbox/ namespace while
# archive and mark-read still change what the operator will notice in their own
# inbox. gmail_label_management folded into email_label_own_namespace for the
# same reason.
#
# store_sensitive_memory stays approval_required and stays unmapped: no tool
# reaches it, because durable writes require the operator review token that the
# assistant does not hold.

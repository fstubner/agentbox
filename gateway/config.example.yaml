# Example Hermes gateway config for Agentbox.
# Copy the relevant sections into the gateway profile's config.yaml, which
# should be owned by root and only readable by the gateway user.

skills:
  write_approval: true
  external_dirs:
    - ./skills

memory:
  write_approval: true

approvals:
  mode: manual
  cron_mode: deny

model:
  provider: openai-compatible
  default: local-main
  base_url: http://127.0.0.1:1234/v1
  api_mode: chat_completions

# The assistant gets no shell, no code execution and no direct file access.
# Everything it does goes through agentbox-mcp below. Hermes also ships its own
# Home Assistant toolset, which would bypass the bridge's refusals, so that is
# off too. `cli/agentbox doctor` checks the shell side of this.
agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - file
    - homeassistant

# One tool server. agentbox-mcp holds bridge tokens only, and the bridges hold
# the upstream credentials, so nothing in this file grants access to anyone's
# mail. The token is an identity token from `cli/agentbox identity add`, or
# AGENTBOX_MCP_SHARED_TOKEN on a single-person box. Put it in the gateway's
# environment rather than in this file.
mcp_servers:
  agentbox:
    url: "http://127.0.0.1:3465/mcp"
    headers:
      Authorization: "Bearer ${AGENTBOX_MCP_TOKEN}"
    timeout: 60
    connect_timeout: 15

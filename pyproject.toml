[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly rather than inheriting ruff's defaults, which expand between
# releases — a version bump can turn CI red with no code change, and that is
# exactly how this pipeline stayed broken for weeks without anybody noticing.
#
# Chosen to catch real defects: pyflakes (F) finds genuine mistakes, bugbear (B)
# finds bug-shaped patterns, isort (I) keeps diffs small, PIE/UP are safe
# simplifications.
#
# `S` (bandit) is deliberately NOT selected, which deserves a note in a codebase
# about refusing things. Turning it on reports ~100 issues, of which nearly all
# are S310 (every urlopen, though every URL here comes from operator config) and
# S106 (every test fixture token). A security check that is wrong a hundred
# times is one people learn to skip — the same failure this project has already
# recorded twice about checks that are permanently red. The real security
# properties are asserted in tests/ instead, where they can be specific.
select = ["E", "W", "F", "I", "B", "PIE", "UP"]
ignore = [
    # Raising inside an `except` without `from` is deliberate throughout the
    # bridges: an upstream error message routinely quotes the input that caused
    # it, and chaining it would carry that into a response.
    "B904",
    # 21 lines exceed 120, all of them single-line tool-schema dicts in the
    # google integration and the bridge that serves it. Mechanically wrapping
    # them was tried and made the schemas harder to read, not easier — a schema
    # is one object and splitting it across six lines obscures that. Left as a
    # known debt rather than pretended away: worth reformatting properly when
    # those schemas are next edited by hand.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# These modules live in containers and are loaded by path, so the tests must
# extend sys.path before importing them — the import genuinely cannot come
# first. policy_gate additionally binds its paths as default arguments at
# import time, so even the ordering between two imports is load-bearing.
"tests/test_approvals.py" = ["E402"]
"tests/test_mcp_base.py" = ["E402"]
"tests/test_policy_gate.py" = ["E402"]

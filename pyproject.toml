# Dual licensed, MIT or Apache-2.0 at your option: LICENSE-MIT and
# LICENSE-APACHE. There is no [build-system] and nothing packages this. The
# metadata is here so the licence is machine-readable, not only a pair of
# files somebody has to notice.
[project]
name = "agentbox"
version = "0.0.0"
description = "A self-hosted household assistant that runs on hardware you own."
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.12"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# I pin the rule set rather than inherit ruff's defaults, which grow between
# releases, so a version bump cannot turn CI red with no code change.
#
# pyflakes (F) finds real mistakes, bugbear (B) finds bug-shaped patterns,
# isort (I) keeps diffs small, and PIE/UP are safe simplifications.
#
# `S` (bandit) is not selected. It reports about 100 issues, nearly all S310
# (every urlopen, though every URL comes from operator config) and S106 (every
# test fixture token). A security check that is wrong a hundred times is one
# people learn to skip. The security properties are asserted in tests/ instead,
# where they can be specific.
select = ["E", "W", "F", "I", "B", "PIE", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# These modules live in containers and are loaded by path, so the tests must
# extend sys.path before importing them, so the import cannot come first. policy_gate additionally binds its paths as default arguments at
# import time, so even the ordering between two imports is load-bearing.
"tests/test_approvals.py" = ["E402"]
"tests/test_mcp_base.py" = ["E402"]
"tests/test_policy_gate.py" = ["E402"]
